    <!--
      Tracking. IDs come from VITE_GA4_ID, VITE_META_PIXEL_ID and
      VITE_LINKEDIN_PARTNER_ID at build time; a tag with no ID never loads.
      Stubs are defined immediately so events queue up, and the vendor
      scripts load after the page has finished loading to protect
      Lighthouse performance. Lead events (Meta "Lead", LinkedIn conversion)
      fire from src/lib/analytics.js on form_submit_success.
    -->
    <script>
      ;(function () {
        var GA4_ID = '__GA4_ID__'
        var META_PIXEL_ID = '__META_PIXEL_ID__'
        var LINKEDIN_PARTNER_ID = '__LINKEDIN_PARTNER_ID__'
        var queue = []

        // Google Analytics 4
        if (GA4_ID) {
          window.dataLayer = window.dataLayer || []
          window.gtag = function () { window.dataLayer.push(arguments) }
          window.gtag('js', new Date())
          window.gtag('config', GA4_ID)
          queue.push('https://www.googletagmanager.com/gtag/js?id=' + GA4_ID)
        }

        // Meta Pixel (placeholder: set VITE_META_PIXEL_ID)
        if (META_PIXEL_ID) {
          !(function (f, n) {
            if (f.fbq) return
            n = f.fbq = function () { n.callMethod ? n.callMethod.apply(n, arguments) : n.queue.push(arguments) }
            if (!f._fbq) f._fbq = n
            n.push = n; n.loaded = !0; n.version = '2.0'; n.queue = []
          })(window)
          window.fbq('init', META_PIXEL_ID)
          window.fbq('track', 'PageView')
          queue.push('https://connect.facebook.net/en_US/fbevents.js')
        }

        // LinkedIn Insight Tag (placeholder: set VITE_LINKEDIN_PARTNER_ID)
        if (LINKEDIN_PARTNER_ID) {
          window._linkedin_partner_id = LINKEDIN_PARTNER_ID
          window._linkedin_data_partner_ids = window._linkedin_data_partner_ids || []
          window._linkedin_data_partner_ids.push(LINKEDIN_PARTNER_ID)
          if (!window.lintrk) {
            window.lintrk = function (a, b) { window.lintrk.q.push([a, b]) }
            window.lintrk.q = []
          }
          queue.push('https://snap.licdn.com/li.lms-analytics/insight.min.js')
        }

        if (!queue.length) return
        function load() {
          queue.forEach(function (src) {
            var s = document.createElement('script')
            s.async = true
            s.src = src
            document.head.appendChild(s)
          })
        }
        window.addEventListener('load', function () {
          'requestIdleCallback' in window ? requestIdleCallback(load, { timeout: 3000 }) : setTimeout(load, 1500)
        })
      })()
    </script>
